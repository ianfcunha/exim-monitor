[uwsgi]
; ── Aplicação ASGI (FastAPI/Starlette) ──────────────────────────────
http-socket = 0.0.0.0:8000
module      = app.main
callable    = app

; ── Workers ──────────────────────────────────────────────────────────
; Mantém processes=1 porque o coletor em background usa cache em memória
; compartilhada. Para múltiplos processos, migre o cache para Redis.
master      = true
processes   = 1
threads     = 4
single-interpreter = true

; ── Suporte ASGI / asyncio ───────────────────────────────────────────
; asyncio=N : tarefas async simultâneas por worker (ajuste conforme carga)
; greenlet-lazy=true : inicializa o loop asyncio sob demanda
asyncio          = 50
greenlet-lazy    = true

; ── Timeouts ─────────────────────────────────────────────────────────
; harakiri encerra worker preso; socket-timeout cobre conexões lentas
socket-timeout   = 30
harakiri         = 120

; ── Logging ──────────────────────────────────────────────────────────
; log-slow registra requisições acima de 2s (útil para SSH lento)
disable-logging  = false
log-slow         = 2000
logformat        = [%(ltime)] %(method) %(uri) %(status) %(msecs)ms

; ── Estabilidade ─────────────────────────────────────────────────────
; Reinicia worker se ultrapassar 200 MB de RSS
reload-on-rss    = 200
max-requests     = 1000

; ── Stats (descomente para monitoramento interno) ────────────────────
; stats = 127.0.0.1:9191
