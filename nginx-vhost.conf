# =============================================================================
# EXIM Monitor — Virtual Host para Cloudez/Configr (nginx reverse proxy)
# =============================================================================
# Substitua "monitor.seudominio.com" pelo subdomínio real antes de usar.
#
# Como instalar:
#   1. Crie o subdomínio no painel da Cloudez/Configr
#   2. Copie este arquivo para /etc/nginx/sites-available/exim-monitor.conf
#   3. Habilite: ln -s /etc/nginx/sites-available/exim-monitor.conf /etc/nginx/sites-enabled/
#   4. Teste: nginx -t
#   5. Recarregue: systemctl reload nginx
#   6. (Opcional) SSL: certbot --nginx -d monitor.seudominio.com
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name monitor.seudominio.com;

    # Redireciona HTTP → HTTPS se você habilitar SSL via certbot (descomente após emitir o certificado)
    # return 301 https://$host$request_uri;

    # Proxy para o frontend (container Docker na porta 5173)
    location / {
        proxy_pass         http://127.0.0.1:5173;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (necessário para hot-reload e eventos em tempo real)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }

    # (Opcional) Expor a API do backend diretamente via /api — normalmente não é necessário
    # pois o nginx interno do container frontend já faz o proxy /api → backend:8000
    # Descomente apenas se quiser acesso direto à API pelo subdomínio
    # location /api/ {
    #     proxy_pass         http://127.0.0.1:8000;
    #     proxy_set_header   Host            $host;
    #     proxy_set_header   X-Real-IP       $remote_addr;
    #     proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}

# =============================================================================
# Bloco HTTPS — gerado automaticamente pelo certbot após:
#   certbot --nginx -d monitor.seudominio.com
# Não edite manualmente; certbot gerencia este bloco.
# =============================================================================
