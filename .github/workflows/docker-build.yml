# .github/workflows/docker-build.yml
# Publica as imagens do painel no GitHub Container Registry (ghcr.io).
#
# - push na branch main  → tags moveis :main e :sha-<curto>  (dev/homolog)
# - tag git vX.Y.Z       → tags versionadas :X.Y.Z, :X.Y e :latest  (release)
# - pull request         → build de validacao, sem push
#
# Registry: ghcr.io/<owner>/exim-monitor-backend e -frontend. Os pacotes
# nascem privados; o CI autentica com o GITHUB_TOKEN nativo (nenhum secret
# a configurar). Para o cliente puxar, ver deploy/docs/instalar.md
# (um Personal Access Token read-only, documentado no guia).
#
# Deploy a partir destas imagens: deploy/docker-compose.yml + deploy/upgrade.sh.

name: Build & Push Docker Images

on:
  push:
    branches: [main]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # diag-exim/ (pacote open-core) fica na raiz do repo, fora do contexto
      # de build do backend. A imagem precisa carrega-lo em /app/diag-exim/
      # para o deploy sem codigo-fonte (o ssh.py o envia por SFTP ao servidor
      # monitorado). No compose de dev o volume ./diag-exim sobrepoe esta copia.
      - name: Stage diag-exim into backend build context
        if: matrix.component == 'backend'
        run: cp -r diag-exim backend/diag-exim

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & Push ${{ matrix.component }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MAILIQ_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
